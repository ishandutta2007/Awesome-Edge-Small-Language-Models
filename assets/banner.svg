<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Text Header Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Edge Pulse Gradient -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <style>
      .pulse-fast {
        animation: pulseFade 2.5s infinite ease-in-out;
      }
      .pulse-slow {
        animation: pulseFade 4s infinite ease-in-out;
      }
      .pulse-delay {
        animation: pulseFade 3.2s infinite ease-in-out 1.2s;
      }
      .data-stream {
        stroke-dasharray: 8, 8;
        animation: flowDash 20s linear infinite;
      }
      .grid-line {
        stroke: #38bdf8;
        stroke-opacity: 0.06;
        stroke-width: 1;
      }
      @keyframes pulseFade {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.95; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -320; }
      }
      .font-heading {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-weight: 800;
      }
      .font-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .font-bold {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bgGrad)" rx="16"/>

  <!-- Futuristic Grid -->
  <g class="grid">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="380" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="380" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="380" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="380" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="380" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="380" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="380" class="grid-line" />
  </g>

  <!-- Dynamic / Animated Edge Neural Synapses in Background -->
  <g>
    <!-- Connecting Neural Data Streams -->
    <path d="M 90 90 Q 280 30 450 80 T 780 60 T 1110 110" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.6" class="data-stream"/>
    <path d="M 70 290 Q 260 340 540 300 T 940 320 T 1130 270" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-opacity="0.6" class="data-stream"/>
    <path d="M 180 70 L 130 270" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.25"/>
    <path d="M 1020 70 L 1070 290" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.25"/>

    <!-- Edge Nodes with Dynamic Pulsing Halo -->
    <circle cx="90" cy="90" r="22" fill="url(#pulseGlow)" class="pulse-fast" />
    <circle cx="90" cy="90" r="5" fill="#38bdf8" />

    <circle cx="280" cy="40" r="18" fill="url(#pulseGlow)" class="pulse-slow" />
    <circle cx="280" cy="40" r="4.5" fill="#818cf8" />

    <circle cx="1110" cy="110" r="24" fill="url(#pulseGlow)" class="pulse-delay" />
    <circle cx="1110" cy="110" r="6" fill="#c084fc" />

    <circle cx="960" cy="50" r="18" fill="url(#pulseGlow)" class="pulse-fast" />
    <circle cx="960" cy="50" r="4.5" fill="#38bdf8" />

    <circle cx="130" cy="270" r="22" fill="url(#pulseGlow)" class="pulse-slow" />
    <circle cx="130" cy="270" r="5" fill="#06b6d4" />

    <circle cx="1060" cy="280" r="20" fill="url(#pulseGlow)" class="pulse-fast" />
    <circle cx="1060" cy="280" r="5" fill="#f43f5e" />
  </g>

  <!-- Outer Border Frame -->
  <rect x="2" y="2" width="1196" height="376" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.8"/>

  <!-- Center Card Backdrop for Foreground Elements -->
  <rect x="150" y="45" width="900" height="245" rx="18" fill="#0b1120" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Foreground Content: Unhidden, Clear, Standout Typography -->
  <g id="foreground">
    <!-- Top Pill Badge -->
    <g transform="translate(480, 68)">
      <rect width="240" height="28" rx="14" fill="#0f2438" stroke="#0284c7" stroke-width="1.2"/>
      <circle cx="16" cy="14" r="4" fill="#38bdf8" class="pulse-fast"/>
      <text x="28" y="19" fill="#38bdf8" class="font-bold" font-size="11.5" letter-spacing="1.5">ON-DEVICE AI ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" fill="url(#textGrad)" class="font-heading" font-size="37" letter-spacing="-0.5">
      Awesome Edge &amp; Small Language Models
    </text>

    <!-- Subtitle -->
    <text x="600" y="184" text-anchor="middle" fill="#94a3b8" class="font-sub" font-size="16.5">
      Curated Directory of On-Device SLMs • Mobile Runtimes • Embedded NPU Engines • Edge AI
    </text>

    <!-- Key Highlights Row -->
    <text x="600" y="219" text-anchor="middle" fill="#38bdf8" class="font-bold" font-size="13.5">
      ⚡ Ultra-Low Latency &#160;•&#160; 🔒 100% Offline Privacy &#160;•&#160; 🔋 Zero Cloud Costs &#160;•&#160; 📱 Mobile &amp; Microcontrollers
    </text>

    <!-- Floating Filter Pills -->
    <g transform="translate(165, 246)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="150" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="75" y="17" text-anchor="middle" fill="#cbd5e1" class="font-bold" font-size="12">🤖 Sub-4B Models</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(165, 0)">
        <rect width="180" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="90" y="17" text-anchor="middle" fill="#cbd5e1" class="font-bold" font-size="12">⚡ LiteRT &amp; llama.cpp</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(360, 0)">
        <rect width="180" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="90" y="17" text-anchor="middle" fill="#cbd5e1" class="font-bold" font-size="12">🍏 Apple Silicon &amp; NPU</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(555, 0)">
        <rect width="165" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="82" y="17" text-anchor="middle" fill="#cbd5e1" class="font-bold" font-size="12">📦 GGUF &amp; ONNX</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(735, 0)">
        <rect width="135" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="67" y="17" text-anchor="middle" fill="#cbd5e1" class="font-bold" font-size="12">🎯 TinyML &amp; IoT</text>
      </g>
    </g>
  </g>

  <!-- Bottom Aesthetic Accent Line -->
  <line x1="250" y1="355" x2="950" y2="355" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.6"/>
</svg>
